name: Build and publish Foundry module
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate JavaScript and manifest
        run: |
          node --check scripts/h0d-token-tooltip.js
          python3 -m json.tool module.json > /dev/null
      - name: Package and publish release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(python3 -c 'import json;print(json.load(open("module.json"))["version"])')
          TAG="v$VERSION"
          if gh release view "$TAG" >/dev/null 2>&1; then echo "Release $TAG already exists"; exit 0; fi
          zip -q -r h0d-token-tooltip.zip module.json scripts styles README.md LICENSE
          gh release create "$TAG" h0d-token-tooltip.zip module.json --target "$GITHUB_SHA" --title "H0D Token Tooltip $TAG" --notes "PER / DET / portée, sens spéciaux et capteurs machines."
